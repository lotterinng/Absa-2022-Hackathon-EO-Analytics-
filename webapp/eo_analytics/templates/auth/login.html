{% extends "auth/_layout.html" %}
{% from "_icons.html" import icon %}
{% block title %}Sign in{% endblock %}
{% block form %}
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="input-icon">{{ icon('mail') }}<input type="email" name="email" placeholder="Email" aria-label="Email" required autofocus value="{{ request.form.email }}"></div>
  <div class="input-icon" style="margin-top:16px">{{ icon('key') }}<input type="password" name="password" placeholder="Password" aria-label="Password" required></div>
  <button class="btn dark block">Login</button>
</form>
<div class="links">
  <p>Don't have an account? <a href="{{ url_for('auth.register') }}"><b>SignUp</b></a></p>
  <p>Forgot password? <a href="{{ url_for('auth.forgot') }}"><b>Reset</b></a></p>
</div>
{% endblock %}
